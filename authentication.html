<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Registration</title>
    <link rel="stylesheet" href="css/authentication.css" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  </head>
  <body>

    <div class="container">
      
      <div class="form-box login">
        <form id="login-form">
          <h1>Login</h1>
          <div class="input-box">
            <input type="text" id="login-username" placeholder="Username" required />
            <i class="bx bxs-user"></i>
          </div>
          <div class="input-box">
            <input type="password" id="login-password" placeholder="Password" required />
            <i class="bx bxs-lock-alt"></i>
          </div>
          <div class="forgot-link">
            <a href="#">Forgot Password?</a>
          </div>
          <button type="submit" class="btn" id="login-submit-btn">Login</button>
          <p>or login with social platforms</p>
          <div class="social-icons">
            <a href="#" id="google-login-btn"><i class="bx bxl-google"></i></a>
          </div>
        </form>
      </div>

      <div class="form-box register">
        
        <form id="register-form">
          <h1>Registration</h1>
          <div class="input-box">
            <input type="text" id="reg-username" placeholder="Username" required />
            <i class="bx bxs-user"></i>
          </div>
          <div class="input-box">
            <input type="email" id="reg-email" placeholder="Email" required />
            <i class="bx bxs-envelope"></i>
          </div>
          <div class="input-box">
            <input type="password" id="reg-password" placeholder="Password" required />
            <i class="bx bxs-lock-alt"></i>
          </div>
          <button type="submit" class="btn" id="reg-btn">Register</button>
          <p>or register with social platforms</p>
          <div class="social-icons">
            <a href="#" id="google-register-btn"><i class="bx bxl-google"></i></a>
          </div>
        </form>

        <form id="otp-form" style="display: none;">
          <h1>Verify OTP</h1>
          <p style="margin: 15px 0; color: #333;">We sent a 4-digit code to your email.</p>
          <div class="input-box">
            <input type="text" id="otp-input" placeholder="Enter OTP Code" required />
            <i class="bx bxs-key"></i>
          </div>
          <button type="submit" class="btn" id="verify-btn">Verify & Login</button>
        </form>

      </div> 
      
      <div class="toggle-box">
        <div class="toggle-panel toggle-left">
          <h1>Hello, Welcome!</h1>
          <p>Don't have an account?</p>
          <button class="btn register-btn">Register</button>
        </div>

        <div class="toggle-panel toggle-right">
          <h1>Welcome Back!</h1>
          <p>Already have an account?</p>
          <button class="btn login-btn">Login</button>
        </div>
      </div>

    </div>

    <script src="./script.js"></script>

    <!-- Google Authentication Script එක මෙතනින් පටන් ගනී -->
    <script>
      const GOOGLE_CLIENT_ID = '1016915787289-jr4ctm1lejack71c1tfpoekttb55u9vn.apps.googleusercontent.com';
      const REDIRECT_URI = window.location.origin + window.location.pathname;

      function loginWithGoogle(e) {
          e.preventDefault();
          const scope = 'https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile';
          const authUrl = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${GOOGLE_CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=${encodeURIComponent(scope)}`;
          window.location.href = authUrl;
      }

      document.getElementById('google-login-btn').addEventListener('click', loginWithGoogle);
      document.getElementById('google-register-btn').addEventListener('click', loginWithGoogle);

      window.addEventListener('load', () => {
          const hash = window.location.hash;
          if (hash) {
              const params = new URLSearchParams(hash.substring(1));
              const accessToken = params.get('access_token');
              
              if (accessToken) {
                  fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                      headers: { 'Authorization': `Bearer ${accessToken}` }
                  })
                  .then(response => response.json())
                  .then(userData => {
                      localStorage.setItem('bloomUsername', userData.email);
                      localStorage.setItem('bloomPassword', 'GOOGLE_SIGNED_IN');
                      alert(`Welcome ${userData.name}! Google Authentication Successful.`);
                      window.location.href = "home.html";
                  })
                  .catch(error => {
                      console.error('Error fetching Google User Info:', error);
                      alert('Google Authentication Failed!');
                  });
              }
          }
      });
    </script>
  </body>
</html>
